name: Deploy

# Har baar `main` par push karne se backend aur site dono khud update ho
# jaayenge. Actions tab se "Run workflow" par manually bhi chala sakte hain.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Do deploy ek saath na chalein (warna FTP state file kharab ho sakti hai)
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  # Backend pehle, website baad mein.
  #
  # Ye workflow pehle sirf dist/ ko FTP karta tha aur functions/ kabhi deploy
  # hota hi nahi tha. Natija: deleteOrg ka button live chala gaya jabke wo
  # function project mein mojood hi nahi tha — browser 404 par jaata tha aur
  # Firebase SDK use "internal" bana kar dikhata tha. Us tarah ki khamoshi se
  # tooti hui cheez dhoondhna mushkil hai.
  #
  # Is liye tarteeb ye hai: jise website bulati hai wo pehle mojood ho. Site
  # ka job is ke poora hone ka intezar karta hai (needs: functions), aur ye
  # fail ho jaye to site nahi jaati.
  #
  # Har push par chalta hai. firebase-tools un functions ko khud chhod deta
  # hai jinka code nahi badla, is liye "sirf jab functions/ badle" wali nazuk
  # shart ki zaroorat nahi.
  functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Service account key ek file mein — firebase-tools use
      # GOOGLE_APPLICATION_CREDENTIALS se uthata hai. `firebase login:ci` wale
      # token ke bajaye ye, kyunki wo tareeqa deprecated hai.
      - name: Write the service account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret set nahi hai."
            echo "Firebase Console > Project settings > Service accounts se JSON"
            echo "key banaen aur repo ke GitHub Secrets mein daalen."
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Deploy functions
        run: npx --yes firebase-tools@14 deploy --only functions --project imaan-app-1d2da --non-interactive

      # Key runner par padi na rahe, chahe deploy fail hi kyun na ho.
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"

  deploy:
    name: Build and upload to public_html
    runs-on: ubuntu-latest
    needs: functions

    # Firebase config local .env se aata hai, jo repo mein nahi hai.
    # CI mein ye GitHub Secrets se aata hai — warna build mein
    # apiKey: "undefined" chala jayega aur live site par login tootega.
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_ENV: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # puppeteer sirf local scripts ke liye hai — CI mein Chromium (~150 MB)
          # download karne ki zaroorat nahi
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Tests fail hone par deploy ruk jaayega — tooti hui site live nahi hogi
      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Upload changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          # Node 24 par FTPS ki data connection Hostinger ke server se
          # "425 Unable to build data connection" de rahi thi (TLS session
          # reuse). Action ko uske apne Node 20 runtime par chalate hain.
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # Is FTP account ka root pehle se hi public_html hai — yahan
          # "public_html/" likhne se public_html/public_html/ ban jata hai.
          server-dir: ./
          # Sirf badli hui files jaati hain — server par
          # .ftp-deploy-sync-state.json rakh kar compare hota hai.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            book1.pdf
            book2.pdf
            book3.pdf
