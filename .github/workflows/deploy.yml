name: Deploy to Hostinger

# Har baar `main` par push karne se site khud update ho jaayegi.
# Actions tab se "Run workflow" par manually bhi chala sakte hain.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_rules:
        description: Deploy Firestore rules with the configured service account
        type: boolean
        default: false

# Do deploy ek saath na chalein (warna FTP state file kharab ho sakti hai)
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ steps.detect.outputs.rules }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect app and rules changes
        id: detect
        env:
          PREVIOUS: ${{ github.event.before }}
          MANUAL_RULES: ${{ inputs.deploy_rules }}
        run: |
          request=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$PREVIOUS^{commit}" 2>/dev/null; then
            request=1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$MANUAL_RULES" = true ]; then
              echo "rules=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$request" = 1 ] || ! git diff --quiet "$PREVIOUS" HEAD -- firestore.rules; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$request" = 1 ] || ! git diff --quiet "$PREVIOUS" HEAD -- flutter_app/ .github/workflows/deploy.yml; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  rules:
    name: Deploy Firestore rules
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.rules == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.rules == 'true'
        with:
          node-version: 22
      - name: Deploy rules only
        if: needs.changes.outputs.rules == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is missing"
            exit 1
          fi
          umask 077
          credentials="$RUNNER_TEMP/firebase-rules.json"
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          GOOGLE_APPLICATION_CREDENTIALS="$credentials" npx --yes firebase-tools@14 deploy --only firestore:rules --project imaan-app-1d2da --non-interactive

  deploy:
    name: Build and upload to public_html
    runs-on: ubuntu-latest
    needs: rules

    # Firebase config local .env se aata hai, jo repo mein nahi hai.
    # CI mein ye GitHub Secrets se aata hai — warna build mein
    # apiKey: "undefined" chala jayega aur live site par login tootega.
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_ENV: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # puppeteer sirf local scripts ke liye hai — CI mein Chromium (~150 MB)
          # download karne ki zaroorat nahi
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Tests fail hone par deploy ruk jaayega — tooti hui site live nahi hogi
      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Upload changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          # Node 24 par FTPS ki data connection Hostinger ke server se
          # "425 Unable to build data connection" de rahi thi (TLS session
          # reuse). Action ko uske apne Node 20 runtime par chalate hain.
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # Is FTP account ka root pehle se hi public_html hai — yahan
          # "public_html/" likhne se public_html/public_html/ ban jata hai.
          server-dir: ./
          # Sirf badli hui files jaati hain — server par
          # .ftp-deploy-sync-state.json rakh kar compare hota hai.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            book1.pdf
            book2.pdf
            book3.pdf
            # The Flutter web app lives in public_html/app/ and is uploaded
            # separately (flutter_app/build/imaan-web-app.zip); this site
            # deploy must never upload into or delete from that folder.
            app/**

  app:
    name: Build and upload website app
    needs: [changes, rules]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3
      - name: Configure the production web client
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
        run: |
          python - <<'PY'
          import json, os
          required = 'FIREBASE_API_KEY FIREBASE_WEB_APP_ID FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_AUTH_DOMAIN FIREBASE_STORAGE_BUCKET'.split()
          configuration = {name: os.environ.get(name, '') for name in required}
          if not all(configuration.values()) or configuration['FIREBASE_PROJECT_ID'] != 'imaan-app-1d2da':
              raise SystemExit('The app requires the production Firebase client configuration.')
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'imaan-web-config.json'), 'w') as file:
              json.dump(configuration, file)
          PY
      - name: Check Journey publication for this curriculum package
        id: journey
        run: |
          node scripts/build-journey-preview.mjs --verify
          python - <<'PY'
          import json, os, re
          from urllib.error import HTTPError
          from urllib.request import urlopen

          with open(os.path.join(os.environ['RUNNER_TEMP'], 'imaan-web-config.json')) as file:
              project = json.load(file)['FIREBASE_PROJECT_ID']
          with open('flutter_app/assets/data/journey-preview.json', encoding='utf-8') as file:
              package = json.load(file)
          release_hash = package['releaseHash']
          if not re.fullmatch(r'[0-9a-f]{64}', release_hash):
              raise SystemExit('Invalid Journey package hash.')
          url = (f'https://firestore.googleapis.com/v1/projects/{project}/databases/'
                 f'(default)/documents/journey_publications/{release_hash}')
          try:
              with urlopen(url, timeout=15) as response:
                  fields = json.load(response)['fields']
              active = fields.get('active', {}).get('booleanValue') is True
          except HTTPError as error:
              if error.code not in (403, 404):
                  raise
              active = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'public={str(active).lower()}', file=output)
          PY
      - name: Build the public app
        working-directory: flutter_app
        env:
          JOURNEY_PUBLIC: ${{ steps.journey.outputs.public }}
        run: |
          flutter build web --release --base-href=/app/ \
            --dart-define-from-file="$RUNNER_TEMP/imaan-web-config.json" \
            --dart-define=LEARNING_JOURNEY_RELEASE="$JOURNEY_PUBLIC"
          if [ "$JOURNEY_PUBLIC" != true ]; then
            rm -f build/web/assets/assets/data/journey-preview.json
          fi
          printf '{"commit":"%s","journeyPublic":%s}\n' "$GITHUB_SHA" "$JOURNEY_PUBLIC" > build/web/imaan-build.json
      - name: Upload the app separately to public_html/app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./flutter_app/build/web/
          server-dir: ./app/
          state-name: .flutter-ftp-deploy-sync-state.json
