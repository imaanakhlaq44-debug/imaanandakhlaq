name: imaan_akhlaq
description: "Native Imaan & Akhlaq learning app."
publish_to: 'none'
version: 2.0.1+62

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: 6.1.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.3
  package_info_plus: ^10.2.2
  pdfrx: ^2.4.8
  share_plus: ^13.3.1
  shared_preferences: 2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/activities.json
    - assets/data/hadith-demo.json
    - assets/data/journey-preview.json
    - assets/data/courses/
    - assets/fonts/noto-naskh-arabic-OFL.txt
    - assets/fonts/fredoka-OFL.txt
    - assets/images/course-atlas.png
    - assets/images/course-scenes.png
    - assets/images/course-guide-imaan.png
    - assets/images/course-guide-akhlaq.png
    - assets/images/original-imaan.jpg
    - assets/images/original-akhlaq.jpg
    - assets/images/amanpur-map.png
    - assets/images/reading-hero-book1.png
    - assets/images/launch-logo.png
    - assets/audio/voice/


  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700






    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/noto-naskh-arabic.ttf

    # Urdu UI text (Individual section in Urdu mode).
    - family: JameelNoori
      fonts:
        - asset: assets/fonts/jameel-noori-nastaleeq.ttf

    # Brand display face (headings, big numbers). Variable font: set the
    # weight with FontVariation.weight, see displayStyle() in ui_kit.dart.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka.ttf
